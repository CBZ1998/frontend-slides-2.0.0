<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelia Atelier | 详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #20181a;
      --text: #34282b;
      --muted: #76686b;
      --soft: #fff4f7;
      --paper: #fffafb;
      --rose: #e8b7c3;
      --rose-deep: #9a3b54;
      --wine: #653242;
      --sage: #596e61;
      --gold: #c29a63;
      --line: #ead6dc;
      --shadow: 0 24px 70px rgba(70, 35, 46, 0.14);
      --serif: "Cormorant Garamond", "Noto Serif SC", serif;
      --sans: "Inter", "Noto Serif SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      background: var(--soft);
      color: var(--text);
    }

    body {
      min-width: 320px;
      overflow-x: hidden;
      font-family: var(--sans);
    }

    img, video { display: block; width: 100%; height: 100%; object-fit: cover; }
    a { color: inherit; text-decoration: none; }
    button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      padding: 0 48px;
      background: rgba(255, 250, 251, 0.96);
      box-shadow: 0 10px 32px rgba(70, 35, 46, 0.06);
      backdrop-filter: blur(18px);
    }

    .header-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: color 180ms ease;
    }

    .header-back:hover { color: var(--rose-deep); }

    .header-back svg { width: 18px; height: 18px; }

    .brand {
      text-align: center;
      font-family: var(--serif);
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 0.95;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      font-family: var(--sans);
      font-size: 0.52rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .header-right { width: 120px; }

    /* Hero */
    .detail-hero {
      position: relative;
      min-height: 56vh;
      display: grid;
      place-items: center;
      color: #fffafb;
      isolation: isolate;
    }

    .detail-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
    }

    .detail-hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: -1;
      height: 40%;
      background: linear-gradient(0deg, rgba(20, 8, 13, 0.5), transparent);
    }

    .hero-inner {
      text-align: center;
      padding: 100px 24px 60px;
      max-width: 780px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 32px;
      height: 1px;
      background: currentColor;
    }

    h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 0.98; }

    h1 { font-size: clamp(2.8rem, 6vw, 5.6rem); }

    .hero-subtitle {
      margin-top: 18px;
      color: rgba(255, 250, 251, 0.82);
      font-size: 1.08rem;
      line-height: 1.8;
      max-width: 600px;
      margin-inline: auto;
    }

    /* Content */
    .detail-content {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 96px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 460px);
      gap: 48px;
      align-items: start;
    }

    .content-main h2 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      margin-bottom: 22px;
    }

    .content-main p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.88;
      margin-bottom: 18px;
    }

    .content-main ul {
      list-style: none;
      margin: 24px 0;
    }

    .content-main li {
      position: relative;
      padding-left: 28px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .content-main li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rose);
    }

    .content-aside {
      position: sticky;
      top: 100px;
      border: 1px solid var(--line);
      background: rgba(255, 250, 251, 0.82);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .aside-image {
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .aside-image img {
      transition: transform 400ms ease;
    }

    .content-aside:hover .aside-image img {
      transform: scale(1.04);
    }

    .aside-body {
      padding: 22px;
    }

    .aside-body h3 {
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .aside-body p {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .aside-specs {
      display: grid;
      gap: 1px;
      background: var(--line);
      margin: 16px -22px -22px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 22px;
      background: var(--paper);
      font-size: 0.84rem;
    }

    .spec-row span:first-child { color: var(--muted); }
    .spec-row span:last-child { font-weight: 700; }

    /* Gallery */
    .detail-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 56px;
    }

    .gallery-item {
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--soft);
    }

    .gallery-item img {
      transition: transform 400ms ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* Related */
    .related-section {
      padding: 72px 48px 96px;
      background: var(--paper);
    }

    .related-section h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 32px;
      text-align: center;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .related-card {
      display: grid;
      min-height: 340px;
      align-content: end;
      overflow: hidden;
      position: relative;
      color: #fffafb;
      background: var(--ink);
    }

    .related-card img {
      position: absolute;
      inset: 0;
      opacity: 0.86;
      transition: transform 400ms ease;
    }

    .related-card:hover img { transform: scale(1.05); }

    .related-card::after {
      content: "";
      position: absolute;
      inset: 40% 0 0;
      background: linear-gradient(0deg, rgba(28, 12, 18, 0.78), transparent);
    }

    .related-copy {
      position: relative;
      z-index: 2;
      padding: 22px;
    }

    .related-copy span {
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .related-copy h3 {
      margin: 8px 0;
      font-size: 1.6rem;
    }

    .related-copy p {
      color: rgba(255, 250, 251, 0.72);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    /* CTA */
    .detail-cta {
      text-align: center;
      padding: 72px 24px;
    }

    .detail-cta h2 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      margin-bottom: 18px;
    }

    .detail-cta p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.8;
      max-width: 560px;
      margin: 0 auto 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn.primary {
      border-color: var(--rose-deep);
      background: var(--rose-deep);
      color: #fffafb;
    }

    .cta-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Footer */
    .site-footer {
      display: grid;
      grid-template-columns: 1.2fr repeat(3, 1fr);
      gap: 28px;
      padding: 46px 48px;
      background: var(--ink);
      color: #fffafb;
    }

    .site-footer h2 { margin-bottom: 12px; font-size: 2.2rem; }
    .site-footer h3 {
      margin-bottom: 12px;
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .site-footer p, .site-footer a {
      color: rgba(255, 250, 251, 0.68);
      font-size: 0.86rem;
      line-height: 1.8;
    }

    .site-footer nav { display: grid; gap: 8px; }

    /* Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 560ms ease, transform 560ms ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .site-header { padding: 0 24px; }
      .content-grid { grid-template-columns: 1fr; }
      .content-aside { position: relative; top: auto; }
      .related-grid { grid-template-columns: repeat(2, 1fr); }
      .site-footer { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 720px) {
      .site-header { min-height: 64px; padding: 0 16px; }
      .brand { font-size: 1.3rem; }
      .header-back { font-size: 0.7rem; }
      .detail-content { padding: 48px 0 64px; }
      .detail-gallery { grid-template-columns: repeat(2, 1fr); }
      .related-grid { grid-template-columns: 1fr; }
      .site-footer { grid-template-columns: 1fr; }
      .related-section { padding: 56px 16px 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script>

        gallery: [
          "https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&w=800&q=84",

          "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=84"
        ],
        related: [
          { href: "bag-detail.html?topic=style-saddle", img: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=900&q=84", tag: "Style", title: "Roma Saddle", desc: "半月翻盖轮廓，线条柔和" },
          { href: "bag-detail.html?topic=style-baguette", img: "https://images.unsplash.com/photo-1605733513597-a8f8341084e6?auto=format&fit=crop&w=900&q=84", tag: "Style", title: "Milano Baguette", desc: "横向比例，肩背轻盈" },

        ]

        asideTitle: "Roma Saddle 规格",

        body: "<p>Roma Saddle 的设计灵感来自佛罗伦萨传统马术文化。半月形的翻盖线条经过反复调整，最终呈现出既复古又现代的优雅弧度。</p><p>包身采用一体成型工艺，底部的圆润曲线不需要拼接，由工匠在湿润状态下手工塑形。这种工艺要求极高的技巧，每只包需要工匠花费约4小时完成塑形和定型。</p><h2>设计细节</h2><p>翻盖使用旋转锁扣开合，操作优雅且安全性高。链条肩带可以拆卸，方便在手拿包和肩背包之间切换。</p><ul><li>半月形翻盖，弧度经过人体工学优化</li><li>旋转锁扣采用黄铜材质，表面镀香槟金</li><li>内部为全绒面衬里，触感柔软</li><li>可拆卸链条肩带，支持肩背和手拿</li></ul>",

      "style-baguette": {

        ],

    /* ── 渲染逻辑 ── */
    function render() {
      const params = new URLSearchParams(window.location.search);
      const topic = params.get("topic") || "service-bespoke";
      const data = TOPICS[topic];

      if (!data) {
        document.getElementById("mainContent").innerHTML = `
          <div style="text-align:center;padding:200px 24px;">
            <h1 style="font-family:var(--serif);font-size:3rem;margin-bottom:18px;">页面未找到</h1>
            <p style="color:var(--muted);margin-bottom:28px;">请从首页选择要查看的内容。</p>
            <a class="btn primary" href="luxury-bags.html">返回首页</a>
          </div>`;
        return;
      }

      document.title = `Aurelia Atelier | ${data.title}`;

      const heroStyle = `background: linear-gradient(135deg, rgba(59, 27, 38, 0.72), rgba(59, 27, 38, 0.28) 56%, rgba(59, 27, 38, 0.48)), url("${data.heroImg}") center / cover;`;

      const specsHtml = data.specs ? Object.entries(data.specs).map(([k, v]) =>
        `<div class="spec-row"><span>${k}</span><span>${v}</span></div>`
      ).join("") : "";

      const galleryHtml = data.gallery ? data.gallery.map(img =>
        `<div class="gallery-item"><img src="${img}" alt="${data.title}" loading="lazy"></div>`
      ).join("") : "";

      const relatedHtml = data.related ? data.related.map(r =>
        `<a class="related-card" href="${r.href}">
          <img src="${r.img}" alt="${r.title}" loading="lazy">
          <div class="related-copy">
            <span>${r.tag}</span>
            <h3>${r.title}</h3>
            <p>${r.desc}</p>
          </div>
        </a>`
      ).join("") : "";

      document.getElementById("mainContent").innerHTML = `
        <section class="detail-hero" style="${heroStyle}">
          <div class="hero-inner reveal">
            <div class="eyebrow">${data.eyebrow}</div>
            <h1>${data.title}</h1>
            <p class="hero-subtitle">${data.subtitle}</p>
          </div>
        </section>

        <div class="detail-content">
          <div class="content-grid">
            <div class="content-main reveal">${data.body}</div>
            <aside class="content-aside reveal">
              <div class="aside-image">
                <img src="${data.asideImg}" alt="${data.title}" loading="lazy">
              </div>
              <div class="aside-body">
                <h3>${data.asideTitle}</h3>
                <p>${data.asideDesc}</p>
                <div class="aside-specs">${specsHtml}</div>
              </div>
            </aside>
          </div>
          ${data.gallery ? `<div class="detail-gallery reveal">${galleryHtml}</div>` : ""}
        </div>

        ${data.related ? `
        <section class="related-section">
          <h2 class="reveal">相关内容</h2>
          <div class="related-grid">${relatedHtml}</div>
        </section>` : ""}

        <div class="detail-cta reveal">
          <h2>开始你的定制之旅</h2>
          <p>选择你喜欢的包型、颜色、五金和皮料，创造属于你的独一无二的手工定制包。</p>
          <div class="cta-actions">
            <a class="btn primary" href="luxury-bags.html#builder">进入 DIY 设计台</a>
            <a class="btn" href="luxury-bags.html#samples">查看所有样板</a>
          </div>
        </div>
      `;

      // 触发 reveal 动画
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
    }

    render();
  </script>
